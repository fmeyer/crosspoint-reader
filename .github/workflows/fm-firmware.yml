name: fm-tweaks firmware
# Builds the personal release firmware (fm_release: gh_release settings + the
# highlight experiment) with the full custom_sdkconfig core rebuild, and
# publishes it to a rolling "fm-latest" prerelease so the newest binary is
# always at the same URL:
#   https://github.com/<owner>/<repo>/releases/download/fm-latest/firmware.bin

on:
  push:
    branches:
      - fm-tweaks

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build fm_release
        env:
          FM_SHORT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export FM_SHORT_SHA="${FM_SHORT_SHA::7}"
          pio run -e fm_release | tee pio.log

      - name: Build stats
        run: |
          set -euo pipefail
          {
            echo "## fm_release build stats (${GITHUB_SHA::7})"
            grep -E "RAM:\s" -m1 pio.log || echo "- RAM: not found"
            grep -E "Flash:\s" -m1 pio.log || echo "- Flash: not found"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full artifact set
        uses: actions/upload-artifact@v4
        with:
          name: CrossPoint-fm-${{ github.sha }}
          path: |
            .pio/build/fm_release/bootloader.bin
            .pio/build/fm_release/firmware.bin
            .pio/build/fm_release/firmware.elf
            .pio/build/fm_release/firmware.map
            .pio/build/fm_release/partitions.bin

      - name: Publish rolling fm-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          notes="Personal release build (gh_release settings + highlight experiment) from fm-tweaks @ ${short_sha}.

          Flash via https://crosspointreader.com/#flash-tools (Custom .bin), esptool at 0x10000, or SD-card update."
          if gh release view fm-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit fm-latest --repo "$GITHUB_REPOSITORY" \
              --title "fm-tweaks ${short_sha}" --notes "$notes" --prerelease
          else
            gh release create fm-latest --repo "$GITHUB_REPOSITORY" \
              --title "fm-tweaks ${short_sha}" --notes "$notes" --prerelease --target "$GITHUB_SHA"
          fi
          gh release upload fm-latest .pio/build/fm_release/firmware.bin --clobber --repo "$GITHUB_REPOSITORY"
